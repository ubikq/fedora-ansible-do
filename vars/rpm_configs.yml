---
# =============================================================================
# vars/rpm_configs.yml — RPM Application Configuration Backup Registry
# =============================================================================
# Declares which applications have configuration worth backing up and where
# those configuration directories live. Only entries listed here are included
# in the rpm-backup / rpm-restore operations.
#
# Entry format:
#   <label>:
#     no_package_check: false    # set true for non-RPM entries (no rpm -q check)
#     paths:
#       - ~/path/to/config/dir   # directories — contents synced recursively
#     files:
#       - ~/path/to/file.conf    # individual files (optional key)
#
# Behaviour:
#   - Package names are validated via rpm -q (unless no_package_check: true).
#     A warning is added to the report if a package is not installed — this
#     usually indicates a typo in the label.
#   - All paths and files are checked for existence before syncing. A warning is
#     added if ALL entries for a package are missing — this usually indicates a
#     wrong path.
#   - Individual missing paths or files are silently skipped (normal for apps not
#     yet launched or that create config on first use).
# =============================================================================

rpm_configs:

  # ── Base ──────────────────────────────────────────────────────────────────────
  # (no RPM packages with persistent configuration)

  # ── Tools ─────────────────────────────────────────────────────────────────────
  # btrfs-assistant - Manual configuration required
  # syncthing - Manual configuration required; config restore risks unexpected data sync behaviour
  doublecmd-qt6:
    paths:
      - ~/.config/doublecmd          # Main instance
      - ~/.config/doublecmd-dev      # Maintain custom tabs for dev work
    files:
      - ~/.local/share/applications/doublecmd-qt6.desktop
      - ~/.local/share/applications/doublecmd-qt6-dev.desktop

  # ── Desktop ───────────────────────────────────────────────────────────────────
  # (GNOME desktop config backed up under Non-RPM entries below)

  # ── Development ───────────────────────────────────────────────────────────────
  code:
    paths:
      - ~/.config/Code               # settings.json, keybindings.json, snippets/

  # ── Productivity ──────────────────────────────────────────────────────────────
  # (no RPM packages with persistent configuration)

  # ── Communication ─────────────────────────────────────────────────────────────
  brave-browser:
    paths:
      - ~/.config/BraveSoftware

  # ── Graphics ──────────────────────────────────────────────────────────────────
  # (no RPM packages with persistent configuration)

  # ── Media ─────────────────────────────────────────────────────────────────────
  mpv:
    paths:
      - ~/.config/mpv                # config, input bindings, scripts, shaders

  haruna:
    paths:
      - ~/.config/haruna

    # ── Gaming ────────────────────────────────────────────────────────────────────
  # (no RPM packages with persistent configuration)

  # ── Non-RPM entries (no_package_check: true) ──────────────────────────────────
  gnome-desktop:
    no_package_check: true
    paths:
      - ~/.config/gtk-3.0                    # GTK3 theme overrides, custom CSS
      - ~/.config/gtk-4.0                    # GTK4 theme overrides
      - ~/.config/gnome-session              # Session settings
      - ~/.local/share/gnome-shell/extensions # Installed GNOME Shell extensions
      - ~/.themes                            # Custom themes installed per-user
      - ~/.icons                             # Custom icon sets installed per-user
      - ~/.local/share/fonts                 # User-installed fonts
      - ~/.local/share/backgrounds           # Custom wallpapers
      - ~/.local/share/icons                 # Icons
    files:
      - ~/.config/dconf/dconf-settings.ini   # The dconf database is backed and restored as part of tasks
      # - ~/.config/dconf/user               # Alternative: raw dconf binary (not human readable)

  gnome-keyrings:
    no_package_check: true
    paths:
      - ~/.local/share/keyrings   # Gnome keyrings

  fish-shell:
    no_package_check: true
    paths:
      - ~/.config/fish                         # config.fish, functions/, conf.d/, completions/, fish_variables
    files:
      - ~/.config/starship.toml                # only backed up if it exists (silently skipped otherwise)

  flatpak-overrides:
    no_package_check: true
    paths:
      - ~/.local/share/flatpak/overrides   # per-app permission overrides (set by Flatseal)

  niri-and-dms:
    no_package_check: true
    paths:
      - ~/.config/DankMaterialShell
      - ~/.config/niri
      - ~/.local/state/DankMaterialShell

  appimage-shutterencoder:
    no_package_check: true
    paths:
      - ~/Shutter Encoder
  
  appimage-logseq:
    no_package_check: true
    paths:
      - ~/.config/Logseq
