---
# =============================================================================
# vars/smb.yml — SMB / CIFS Share Definitions
# =============================================================================
# Non-secret share configuration lives here.
# Credentials (username/password) are stored in vars/secrets.yml (Vault).
#
# Each share must have a matching entry in vars/secrets.yml:
#
#   smb_credentials:
#     nas_primary:
#       username: actual_user
#       password: actual_pass
#     nas_docs:
#       username: other_user
#       password: other_pass
#
# The 'cred_key' field below references the matching key in smb_credentials.
#
# mount_point accepts either a full absolute path or a ~/... path:
#   mount_point: "~/Mounts/media"       ← expanded to $HOME/Mounts/media
#   mount_point: "/mnt/nas/media"       ← used as-is
# =============================================================================

smb_shares:
  - name: "backups"
    src: "//192.168.1.10/backups"
    mount_point: "~/Mounts/backups"
    cred_key: nas_primary
    cred_file: /etc/samba/.creds_nas_primary
    options: "uid=1000,gid=1000,iocharset=utf8,_netdev"

  - name: "downloads"
    src: "//192.168.1.10/downloads"
    mount_point: "~/Mounts/downloads"
    cred_key: nas_primary
    cred_file: /etc/samba/.creds_nas_primary
    options: "uid=1000,gid=1000,iocharset=utf8,_netdev"

  - name: "media"
    src: "//192.168.1.10/media"
    mount_point: "~/Mounts/media"
    cred_key: nas_primary
    cred_file: /etc/samba/.creds_nas_primary
    options: "uid=1000,gid=1000,iocharset=utf8,_netdev"
