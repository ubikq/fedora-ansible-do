---
# =============================================================================
# fedora-do.yml — Master Playbook
# Copyright (C) 2026 Pieter van Heerden
# SPDX-License-Identifier: GPL-2.0-only
# =============================================================================
# Orchestrates the full Fedora workstation setup by importing task files.
# All configuration lives in vars/; all logic lives in tasks/.
#
# Run modes:  (-K = --ask-become-pass,  -J = --ask-vault-pass)
#
#   1. FULL RUN — no --tags flag; everything runs:
#        ansible-playbook fedora-do.yml -K -J
#
#   2. SPECIFIC TASKS ONLY — only the listed tags run (plus always):
#        ansible-playbook fedora-do.yml -K --tags "tools,media"
#        ansible-playbook fedora-do.yml -K --tags gnome
#        ansible-playbook fedora-do.yml -K --tags "always,all-apps"
#
#   3. FULL RUN, SKIP SOMETHING — everything runs except the skipped tag(s):
#        ansible-playbook fedora-do.yml -K --skip-tags gaming
#        ansible-playbook fedora-do.yml -K --skip-tags "virt,firmware"
#
# Available tags:
#   always | all-apps | desktop | tools | graphics | media | development |
#   productivity | communication | gaming | docker | virt | nocow | smb | gnome |
#   firmware | fonts | shell | git-config | cleanup |
#   backup | restore | flatpak-backup | flatpak-restore | rpm-backup | rpm-restore |
#   niri  (never runs by default — opt-in: --tags niri)
# =============================================================================

- name: Fedora Workstation Setup
  hosts: localhost
  connection: local
  become: false

  vars:
    # ── DNF tuning ─────────────────────────────────────────────────────────────
    dnf_conf_options:
      max_parallel_downloads: 10
      fastestmirror: true
      deltarpm: true
      keepcache: false

  pre_tasks:
    - name: "Pre | Load application catalog"
      ansible.builtin.include_vars:
        file: vars/app_catalog.yml
      tags: always

    - name: "Pre | Load SMB share definitions"
      ansible.builtin.include_vars:
        file: vars/smb.yml
      tags: always

    - name: "Pre | Load GNOME settings"
      ansible.builtin.include_vars:
        file: vars/gnome.yml
      tags: always

    - name: "Pre | Load backup configuration"
      ansible.builtin.include_vars:
        file: vars/backup.yml
      tags: always

    - name: "Pre | Load RPM config backup registry"
      ansible.builtin.include_vars:
        file: vars/rpm_configs.yml
      tags: always

    - name: "Pre | Load filesystem configuration"
      ansible.builtin.include_vars:
        file: vars/filesystem.yml
      tags: always

    - name: "Pre | Load niri / DankMaterialShell configuration"
      ansible.builtin.include_vars:
        file: vars/niri.yml
      tags: always

    - name: "Pre | Load Git configuration (if present)"
      ansible.builtin.include_vars:
        file: vars/git.yml
      failed_when: false
      tags: always

    - name: "Pre | Warn if Git configuration unavailable"
      ansible.builtin.debug:
        msg: >-
          WARNING: vars/git.yml could not be loaded or is missing git_user_name.
          Git identity (user.name, user.email) will not be configured.
          Copy vars/git.yml.template to vars/git.yml, fill in your details, and re-run:
          ansible-playbook fedora-do.yml -K --tags git-config
      when: git_user_name is not defined
      tags: always

    - name: "Pre | Load vault secrets (if present)"
      ansible.builtin.include_vars:
        file: vars/secrets.yml
      failed_when: false
      no_log: true
      tags: always

    - name: "Pre | Warn if vault secrets unavailable"
      ansible.builtin.debug:
        msg: >-
          WARNING: vars/secrets.yml could not be loaded — either the vault password
          was not provided (-J) or the file does not exist. Features requiring SMB
          credentials (backup, restore, SMB mounts) will be skipped automatically.
          Re-run with: ansible-playbook fedora-do.yml -K -J --tags backup
      when: smb_credentials is not defined
      tags: always

    - name: "Pre | Initialize run tracking"
      ansible.builtin.set_fact:
        _run_errors:       []
        _changed_rpms:     []
        _changed_flatpaks: []
        _backup_results:   []
        _nocow_results:    []
        _reboot_reasons:   []
      tags: always

    - name: "Pre | Test sudo (become) access"
      become: true
      ansible.builtin.command:
        cmd: echo "become ok"
      register: _become_check
      changed_when: false
      failed_when: false
      tags: always

    - name: "Pre | Abort if sudo access unavailable"
      ansible.builtin.fail:
        msg: >-
          Sudo access failed — the playbook was probably run without -K.
          Re-run with: ansible-playbook fedora-do.yml -K -J
          (-K = sudo password prompt, -J = vault password for secrets.yml)
      when: (_become_check.rc | default(-1)) != 0
      tags: always

    - name: "Pre | Verify running on Fedora"
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Fedora"
        fail_msg: "This playbook targets Fedora Linux only."
        success_msg: "Confirmed: Fedora {{ ansible_facts.distribution_major_version }}"
      tags: always

  tasks:
    - name: "Include | DNF configuration and system update"
      ansible.builtin.import_tasks: tasks/dnf.yml

    - name: "Include | Firmware updates"
      ansible.builtin.import_tasks: tasks/firmware.yml

    - name: "Include | Repository setup"
      ansible.builtin.import_tasks: tasks/repos.yml

    - name: "Include | RPM package installation"
      ansible.builtin.import_tasks: tasks/packages.yml

    - name: "Include | Flatpak setup and app installation"
      ansible.builtin.import_tasks: tasks/flatpaks.yml

    - name: "Include | Docker CE and Compose"
      ansible.builtin.import_tasks: tasks/docker.yml

    - name: "Include | KVM/QEMU virtualization stack"
      ansible.builtin.import_tasks: tasks/virtualization.yml

    - name: "Include | noCOW directory setup"
      ansible.builtin.import_tasks: tasks/nocow.yml

    - name: "Include | SMB share mounts"
      ansible.builtin.import_tasks: tasks/smb.yml

    - name: "Include | GNOME desktop configuration"
      ansible.builtin.import_tasks: tasks/gnome.yml

    - name: "Include | Niri compositor and DankMaterialShell"
      ansible.builtin.import_tasks: tasks/niri.yml

    - name: "Include | Font installation"
      ansible.builtin.import_tasks: tasks/fonts.yml

    - name: "Include | Shell configuration"
      ansible.builtin.import_tasks: tasks/shell.yml

    - name: "Include | Git global configuration"
      ansible.builtin.import_tasks: tasks/git-config.yml

    - name: "Include | Post-install cleanup"
      ansible.builtin.import_tasks: tasks/cleanup.yml

    - name: "Include | Flatpak config backup and restore"
      ansible.builtin.import_tasks: tasks/backup.yml

  post_tasks:
    - name: "Done | Generate and display deployment report"
      vars:
        esc: "\x1b"
        log_file: >-
          ./logs/install_report_{{ ansible_facts['date_time']['year'] }}{{ ansible_facts['date_time']['month'] }}{{ ansible_facts['date_time']['day'] }}.log
        report_content: |
          ════════════════════════════════════════════════════════════════
          FEDORA SETUP REPORT — {{ ansible_facts['date_time']['date'] }}  {{ ansible_facts['date_time']['time'] }}
          ════════════════════════════════════════════════════════════════
          {% if _changed_rpms | length > 0 %}
          [RPM PACKAGES INSTALLED]
          {% for pkg in _changed_rpms %}
            ✔  {{ pkg }}
          {% endfor %}
          {% endif %}
          {% if _changed_flatpaks | length > 0 %}
          [FLATPAK APPS INSTALLED]
          {% for app in _changed_flatpaks %}
            ✔  {{ app }}
          {% endfor %}
          {% endif %}
          {% if (_changed_rpms | length == 0) and (_changed_flatpaks | length == 0) %}
          All packages were already up to date — no changes made.
          {% endif %}
          {% if _nocow_results | length > 0 %}
          [NOCOW DIRECTORIES]
          {% for msg in _nocow_results %}
            ✔  {{ msg }}
          {% endfor %}
          {% endif %}
          {% if _backup_results | length > 0 %}
          [BACKUP / RESTORE]
          {% for msg in _backup_results %}
            ✔  {{ msg }}
          {% endfor %}
          {% endif %}
          {% if _run_errors | length > 0 %}
          {{ esc }}[1;31m[⚠  FAILURES — ACTION REQUIRED]{{ esc }}[0m
          {% for err in _run_errors %}
            {{ esc }}[31m✖  {{ err }}{{ esc }}[0m
          {% endfor %}
          {% endif %}
          {% if _reboot_reasons | length > 0 %}
          [REQUIRES LOGOUT OR REBOOT]
          {% for reason in _reboot_reasons %}
            • {{ reason }}
          {% endfor %}
          {% endif %}
          ════════════════════════════════════════════════════════════════
      tags: always
      block:
        - name: "Done | Print deployment report"
          ansible.builtin.pause:
            seconds: 1
            prompt: "{{ report_content }}"

        - name: "Done | Ensure log directory exists"
          ansible.builtin.file:
            path: ./logs
            state: directory
            mode: '0755'

        - name: "Done | Read existing log if present"
          ansible.builtin.slurp:
            path: "{{ log_file }}"
          register: _existing_log
          failed_when: false

        - name: "Done | Save deployment report to log"
          ansible.builtin.copy:
            dest: "{{ log_file }}"
            content: "{{ (_existing_log.content | default('') | b64decode) }}{{ report_content }}"
            mode: '0644'
