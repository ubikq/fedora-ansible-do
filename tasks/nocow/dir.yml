---
- name: "NoCOW | Expand path — {{ _nocow_dir }}"
  ansible.builtin.set_fact:
    _nocow_path: "{{ _nocow_dir | replace('~', ansible_facts.user_dir) }}"

- name: "NoCOW | Ensure directory exists — {{ _nocow_path }}"
  ansible.builtin.file:
    path: "{{ _nocow_path }}"
    state: directory
    mode: '0755'

- name: "NoCOW | Detect filesystem type — {{ _nocow_path }}"
  ansible.builtin.command:
    cmd: "findmnt -n -o FSTYPE --target {{ _nocow_path }}"
  register: _nocow_fstype
  changed_when: false
  failed_when: false

- name: "NoCOW | Check existing noCOW attribute — {{ _nocow_path }}"
  ansible.builtin.command:
    cmd: "lsattr -d {{ _nocow_path }}"
  register: _nocow_lsattr
  changed_when: false
  failed_when: false
  when: (_nocow_fstype.stdout | trim) == 'btrfs'

- name: "NoCOW | Set noCOW (+C) — {{ _nocow_path }}"
  ansible.builtin.command:
    cmd: "chattr +C {{ _nocow_path }}"
  when:
    - (_nocow_fstype.stdout | trim) == 'btrfs'
    - "'C' not in (_nocow_lsattr.stdout.split() | first | default(''))"
  register: _nocow_chattr_result
  changed_when: (_nocow_chattr_result.rc | default(1)) == 0
  failed_when: false

- name: "NoCOW | Record result — {{ _nocow_path }}"
  ansible.builtin.set_fact:
    _nocow_results: >-
      {{ _nocow_results + ['NoCOW (+C) set on ' + _nocow_path
         + ' — applies to new files only; existing content retains CoW behaviour'] }}
  when:
    - (_nocow_fstype.stdout | trim) == 'btrfs'
    - (_nocow_chattr_result.rc | default(1)) == 0

- name: "NoCOW | Warn if noCOW could not be set — {{ _nocow_path }}"
  ansible.builtin.set_fact:
    _run_errors: >-
      {{ _run_errors + ['noCOW: chattr +C failed on ' + _nocow_path
         + ' — check ownership and filesystem support.'
         + ' To set manually: chattr +C ' + _nocow_path
         + ' (applies to new files only; existing content retains CoW behaviour)'] }}
  when:
    - (_nocow_fstype.stdout | trim) == 'btrfs'
    - "'C' not in (_nocow_lsattr.stdout.split() | first | default(''))"
    - (_nocow_chattr_result.rc | default(0)) != 0
