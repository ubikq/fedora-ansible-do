---
# =============================================================================
# tasks/backup.yml — Configuration Backup & Restore (dispatcher)
# =============================================================================
# Backs up and restores Flatpak and RPM application configuration.
# Paths and retention are configured in vars/backup.yml.
# RPM config entries are declared in vars/rpm_configs.yml.
#
# Prerequisites: rsync must be installed (included in the 'base' category).
#
# TAGS (all tagged 'never' — only run when explicitly requested):
#   backup          →  run both Flatpak and RPM backup
#   restore         →  run both Flatpak and RPM restore
#   flatpak-backup  →  Flatpak config backup only
#   flatpak-restore →  Flatpak config restore only
#   rpm-backup      →  RPM config backup only
#   rpm-restore     →  RPM config restore only
# =============================================================================

- ansible.builtin.include_tasks: backup/flatpak-backup.yml
- ansible.builtin.include_tasks: backup/flatpak-restore.yml
- ansible.builtin.include_tasks: backup/rpm-backup.yml
- ansible.builtin.include_tasks: backup/rpm-restore.yml
