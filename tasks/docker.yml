---
# =============================================================================
# tasks/docker.yml — Docker CE & Docker Compose
# =============================================================================

- name: "Docker | Gather installed package facts"
  ansible.builtin.package_facts:
    manager: auto
  tags: docker

- name: "Docker | Remove legacy docker packages if present"
  become: true
  ansible.builtin.dnf:
    name: "{{ _legacy | select('in', ansible_facts.packages) | list }}"
    state: absent
  vars:
    _legacy:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-selinux
      - docker-engine-selinux
      - docker-engine
  when: _legacy | select('in', ansible_facts.packages) | list | length > 0
  tags: docker

- name: "Docker | Repository and service setup"
  tags: docker
  block:
    - name: "Docker | Add Docker CE repository"
      become: true
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: "https://download.docker.com/linux/fedora/$releasever/$basearch/stable"
        gpgcheck: true
        gpgkey: "https://download.docker.com/linux/fedora/gpg"
        enabled: true

    - name: "Docker | Install Docker CE and Docker Compose plugin"
      become: true
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        allowerasing: true

    - name: "Docker | Reload systemd daemon"
      become: true
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Docker | Enable and start Docker service"
      become: true
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: "Docker | Add current user to docker group"
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts.user_id }}"
        groups: docker
        append: true
      register: _docker_group_result

    - name: "Docker | Record reboot requirement"
      ansible.builtin.set_fact:
        _reboot_reasons: "{{ _reboot_reasons + ['Docker group membership — run: newgrp docker  (or log out)'] }}"
      when: _docker_group_result is changed
  rescue:
    - name: "Docker | Record setup failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['Docker CE setup failed — repo, install, or service issue'] }}"
