---
# =============================================================================
# tasks/docker.yml — Docker CE & Docker Compose
# =============================================================================

- name: "Docker | Remove legacy docker packages if present"
  become: true
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-selinux
      - docker-engine-selinux
      - docker-engine
    state: absent
  tags: docker

- name: "Docker | Add Docker CE repository"
  become: true
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "https://download.docker.com/linux/fedora/$releasever/$basearch/stable"
    gpgcheck: true
    gpgkey: "https://download.docker.com/linux/fedora/gpg"
    enabled: true
  tags: docker

- name: "Docker | Install Docker CE and Docker Compose plugin"
  become: true
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: docker

- name: "Docker | Reload systemd daemon"
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  tags: docker

- name: "Docker | Enable and start Docker service"
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  tags: docker

- name: "Docker | Add current user to docker group"
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  tags: docker
