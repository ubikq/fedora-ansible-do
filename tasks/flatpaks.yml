---
# =============================================================================
# tasks/flatpaks.yml — Flatpak Setup & Application Installation
# =============================================================================
# Ensures flatpak is installed, adds Flathub as a system-wide remote,
# then installs Flatpak apps per category from vars/app_catalog.yml (app_catalog).
#
# Each app is installed individually so results are tracked per app ID.
# A single tracking task per category appends to _changed_flatpaks (installed)
# and _run_errors (failed) for the end-of-run report.
# =============================================================================

# ── Flathub setup (always) ────────────────────────────────────────────────────
- name: "Flatpak | Flathub setup"
  tags: always
  block:
    - name: "Flatpak | Ensure flatpak is installed"
      become: true
      ansible.builtin.dnf:
        name: flatpak
        state: present

    - name: "Flatpak | Add Flathub as system-wide remote"
      become: true
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: "https://dl.flathub.org/repo/flathub.flatpakrepo"
        method: system

    - name: "Flatpak | Remove user-level Flathub remote (Fedora filtered default)"
      ansible.builtin.command:
        cmd: flatpak remote-delete --user flathub
      register: _fb_user_remote_del
      changed_when: _fb_user_remote_del.rc == 0
      failed_when: false

    - name: "Flatpak | Remove filter from system Flathub remote"
      become: true
      ansible.builtin.command:
        cmd: flatpak remote-modify --system --no-filter flathub
      changed_when: false
      failed_when: false
  rescue:
    - name: "Flatpak | Record Flathub setup failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['Flatpak / Flathub setup failed — all Flatpak installs will be skipped'] }}"

# ── Tools ─────────────────────────────────────────────────────────────────────
- name: "Flatpak [tools] | Install Flatpak apps"
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: system
    remote: flathub
  loop: "{{ app_catalog.tools.flatpak | default([], true) }}"
  register: _fp_tools
  failed_when: false
  tags: tools

- name: "Flatpak [tools] | Track results"
  ansible.builtin.set_fact:
    _changed_flatpaks: "{{ _changed_flatpaks + ([item.item + ' (tools)'] if (item.changed | default(false)) else []) }}"
    _run_errors:       "{{ _run_errors       + (['Flatpak install failed: ' + item.item + ' (tools)'] if (item.rc | default(0) != 0) else []) }}"
  loop: "{{ _fp_tools.results | default([]) }}"
  loop_control:
    label: "{{ ('\x1b[1;31m⚠ FAILED: ' + item.item + '\x1b[0m') if (item.rc | default(0) != 0) else (item.item | default('')) }}"
  tags: tools

