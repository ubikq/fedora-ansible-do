---
# =============================================================================
# tasks/flatpaks.yml — Flatpak Setup & Application Installation
# =============================================================================
# Ensures flatpak is installed, adds Flathub as a system-wide remote,
# then installs Flatpak apps per category from vars/packages.yml (app_catalog).
#
# Each app is installed individually so results are tracked per app ID.
# A single tracking task per category appends to _changed_flatpaks (installed)
# and _run_errors (failed) for the end-of-run report.
# =============================================================================

# ── Flathub setup (always) ────────────────────────────────────────────────────
- name: "Flatpak | Ensure flatpak is installed"
  become: true
  ansible.builtin.dnf:
    name: flatpak
    state: present
  tags: always

- name: "Flatpak | Add Flathub as system-wide remote"
  become: true
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: "https://dl.flathub.org/repo/flathub.flatpakrepo"
    method: system
  tags: always

# ── Desktop ───────────────────────────────────────────────────────────────────
- name: "Flatpak [desktop] | Install Flatpak apps"
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: system
    remote: flathub
  loop: "{{ app_catalog.desktop.flatpak | default([], true) }}"
  register: _fp_desktop
  failed_when: false
  tags: desktop

- name: "Flatpak [desktop] | Track results"
  ansible.builtin.set_fact:
    _changed_flatpaks: "{{ _changed_flatpaks + ([item.item + ' (desktop)'] if (item.changed | default(false)) else []) }}"
    _run_errors:       "{{ _run_errors       + (['Flatpak install failed: ' + item.item + ' (desktop)'] if (item.rc | default(0) != 0) else []) }}"
  loop: "{{ _fp_desktop.results | default([]) }}"
  loop_control:
    label: "{{ ('\x1b[1;31m⚠ FAILED: ' + item.item + '\x1b[0m') if (item.rc | default(0) != 0) else (item.item | default('')) }}"
  tags: desktop

