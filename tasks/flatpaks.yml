# ── All apps (loop over every non-base category) ──────────────────────────────
- name: "Flatpak [all-apps] | Install all category Flatpak apps"
  community.general.flatpak:
    name: "{{ app_catalog[item].flatpak }}"
    state: present
    method: system
    remote: flathub
  loop:
    - tools
    - desktop
    - development
    - productivity
    - communication
    - graphics
    - media
    - gaming
  when: app_catalog[item].flatpak | default([], true) | length > 0
  register: _all_apps_flatpak
  failed_when: false
  tags: all-apps

- name: "Flatpak [all-apps] | Track results"
