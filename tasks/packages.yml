---
# =============================================================================
# tasks/packages.yml — RPM Package Installation
# =============================================================================
# Reads rpm lists from vars/app_catalog.yml (app_catalog).
# Each package is installed individually so results are tracked per package.
# A single tracking task per category appends to _changed_rpms (installed)
# and _run_errors (failed) for the end-of-run report.
# =============================================================================

# ── Base (always) ─────────────────────────────────────────────────────────────
- name: "Packages [base] | Install RPM packages"
  become: true
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: "{{ app_catalog.base.rpm | default([], true) }}"
  register: _pkg_base
  failed_when: false
  tags: always

- name: "Packages [base] | Track results"
  ansible.builtin.set_fact:
    _changed_rpms: "{{ _changed_rpms + ([item.item + ' (base)'] if (item.changed | default(false)) else []) }}"
    _run_errors:   "{{ _run_errors   + (['RPM install failed: ' + item.item + ' (base)'] if (item.rc | default(0) != 0) else []) }}"
  loop: "{{ _pkg_base.results | default([]) }}"
  loop_control:
    label: "{{ ('\x1b[1;31m⚠ FAILED: ' + item.item + '\x1b[0m') if (item.rc | default(0) != 0) else (item.item | default('')) }}"
  tags: always

# ── Tools ─────────────────────────────────────────────────────────────────────
- name: "Packages [tools] | Install RPM packages"
  become: true
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: "{{ app_catalog.tools.rpm | default([], true) }}"
  register: _pkg_tools
  failed_when: false
  when: (run_config.apps_tools | default(true)) or ('tools' in ansible_run_tags)
  tags: tools

- name: "Packages [tools] | Track results"
  ansible.builtin.set_fact:
    _changed_rpms: "{{ _changed_rpms + ([item.item + ' (tools)'] if (item.changed | default(false)) else []) }}"
    _run_errors:   "{{ _run_errors   + (['RPM install failed: ' + item.item + ' (tools)'] if (item.rc | default(0) != 0) else []) }}"
  loop: "{{ _pkg_tools.results | default([]) }}"
  loop_control:
    label: "{{ ('\x1b[1;31m⚠ FAILED: ' + item.item + '\x1b[0m') if (item.rc | default(0) != 0) else (item.item | default('')) }}"
  tags: tools

- name: "Packages [tools] | Enable syncthing user service"
  ansible.builtin.systemd:
    name: syncthing
    enabled: true
    scope: user
  when:
    - (run_config.apps_tools | default(true)) or ('tools' in ansible_run_tags)
    - "'syncthing' in (app_catalog.tools.rpm | default([]))"
  register: _syncthing_service_result
  failed_when: false
  tags: tools

- name: "Packages [tools] | Record syncthing service failure"
  ansible.builtin.set_fact:
    _run_errors: "{{ _run_errors + ['syncthing user service could not be enabled — start manually: systemctl --user enable --now syncthing'] }}"
  when:
    - "'syncthing' in (app_catalog.tools.rpm | default([]))"
    - _syncthing_service_result.failed | default(false)
  tags: tools

- name: "Packages [tools] | Enable and start sshd (required for Cockpit remote access)"
  become: true
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
  register: _sshd_service_result
  failed_when: false
  when: (run_config.apps_tools | default(true)) or ('tools' in ansible_run_tags)
  tags: tools

- name: "Packages [tools] | Record sshd service failure"
  ansible.builtin.set_fact:
    _run_errors: "{{ _run_errors + ['sshd could not be enabled — Cockpit remote access will not work. Fix manually: sudo systemctl enable --now sshd'] }}"
  when: _sshd_service_result.failed | default(false)
  tags: tools

