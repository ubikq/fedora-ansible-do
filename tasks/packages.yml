# ── All apps (loop over every non-base category) ──────────────────────────────
- name: "Packages [all-apps] | Install all category RPM packages"
  become: true
  ansible.builtin.dnf:
    name: "{{ app_catalog[item].rpm }}"
    state: present
  loop:
    - tools
    - desktop
    - development
    - productivity
    - communication
    - graphics
    - media
    - gaming
  when: app_catalog[item].rpm | default([], true) | length > 0
  register: _all_apps_rpm
  failed_when: false
  tags: [never, all-apps]

- name: "Packages [all-apps] | Track results"
