---
# =============================================================================
# tasks/virtualization.yml — KVM / QEMU / libvirt Stack
# =============================================================================
# Installs the full @virtualization DNF group (qemu-kvm, libvirt, virt-manager,
# virt-viewer, etc.), enables the libvirtd service, and adds the current user
# to the libvirt and kvm groups (requires logout to take effect).
# =============================================================================

- name: "Virt | KVM, QEMU and libvirt setup"
  tags: virt
  when: (run_config.virtualization | default(true)) or ('virt' in ansible_run_tags)
  block:
    - name: "Virt | Install virtualization group"
      become: true
      ansible.builtin.dnf:
        name: "@virtualization"
        state: present

    - name: "Virt | Enable and start libvirtd"
      become: true
      ansible.builtin.systemd:
        name: libvirtd
        enabled: true
        state: started

    - name: "Virt | Add user to libvirt group"
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts.user_id }}"
        groups: libvirt
        append: true

    - name: "Virt | Add user to kvm group"
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts.user_id }}"
        groups: kvm
        append: true
      register: _virt_group_result

    - name: "Virt | Record reboot requirement"
      ansible.builtin.set_fact:
        _reboot_reasons: "{{ _reboot_reasons + ['libvirt/kvm group membership — log out and back in'] }}"
      when: _virt_group_result is changed
  rescue:
    - name: "Virt | Record setup failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['Virtualization setup failed — KVM/QEMU/libvirt may not be fully configured'] }}"
