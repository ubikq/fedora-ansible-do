---
# =============================================================================
# tasks/shell.yml — Shell Configuration
# =============================================================================
# Installs fish shell and starship prompt (both available in Fedora repos),
# sets fish as the default shell for the current user, and wires starship
# into fish config (only if the init line is not already present).
# =============================================================================

- name: "Shell | Install fish and starship"
  become: true
  ansible.builtin.dnf:
    name:
      - fish
      - starship
    state: present
  tags: shell

- name: "Shell | Set fish as default shell"
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/fish
  tags: shell

- name: "Shell | Ensure fish config directory exists"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/fish"
    state: directory
    mode: '0755'
  tags: shell

- name: "Shell | Enable starship in fish config"
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/fish/config.fish"
    line: 'starship init fish | source'
    create: true
    mode: '0644'
  tags: shell
