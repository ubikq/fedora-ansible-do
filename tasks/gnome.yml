      loop: "{{ gnome_privacy_settings }}"
  rescue:
    - name: "GNOME | Record privacy settings failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: privacy dconf settings failed — check vars/gnome.yml'] }}"
  tags: gnome

- block:
    - name: "GNOME | Apply power settings"
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop: "{{ gnome_power_settings }}"
  rescue:
    - name: "GNOME | Record power settings failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: power dconf settings failed — check vars/gnome.yml'] }}"
  tags: gnome

- block:
    - name: "GNOME | Apply Night Light settings"
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop: "{{ gnome_night_light_settings }}"
  rescue:
    - name: "GNOME | Record Night Light settings failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: Night Light dconf settings failed — check vars/gnome.yml'] }}"
