# ── Enable extensions ─────────────────────────────────────────────────────────
- name: "GNOME | Enable shell extensions"
  tags: gnome
  block:
    - name: "GNOME | Read currently enabled extensions"
      ansible.builtin.command:
        cmd: dconf read /org/gnome/shell/enabled-extensions
      register: gnome_current_extensions_raw
      changed_when: false

    - name: "GNOME | Enable listed shell extensions (additive)"
      community.general.dconf:
        key: "/org/gnome/shell/enabled-extensions"
        value: >-
          {{
            (
              (gnome_current_extensions_raw.stdout
                | regex_replace('@as \\[\\]', '[]')
                | default('[]', true)
                | regex_replace("'", '"')
                | from_json)
              + gnome_enabled_extensions
            ) | unique | to_json | regex_replace('"', "'")
          }}
        state: present
      register: _gnome_ext_result

    - name: "GNOME | Record reboot requirement"
      ansible.builtin.set_fact:
        _reboot_reasons: "{{ _reboot_reasons + ['GNOME extensions changed — log out and back in'] }}"
      when: _gnome_ext_result is changed
  rescue:
    - name: "GNOME | Record extension enable failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: enabling shell extensions failed — check vars/gnome.yml gnome_enabled_extensions'] }}"

