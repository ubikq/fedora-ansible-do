- block:
    - name: "GNOME | Apply Nautilus file manager settings"
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop: "{{ gnome_nautilus_settings }}"
  rescue:
    - name: "GNOME | Record Nautilus settings failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: Nautilus dconf settings failed — check vars/gnome.yml'] }}"
  tags: gnome

# ── Enable extensions ─────────────────────────────────────────────────────────
- block:
    - name: "GNOME | Read currently enabled extensions"
      ansible.builtin.command:
        cmd: dconf read /org/gnome/shell/enabled-extensions
      register: gnome_current_extensions_raw
      changed_when: false

    - name: "GNOME | Enable listed shell extensions (additive)"
      community.general.dconf:
        key: "/org/gnome/shell/enabled-extensions"
        value: >-
          {{
            (
              (gnome_current_extensions_raw.stdout
                | regex_replace('@as \\[\\]', '[]')
                | default('[]', true)
                | regex_replace("'", '"')
                | from_json)
              + gnome_enabled_extensions
            ) | unique | to_json | regex_replace('"', "'")
          }}
        state: present
  rescue:
    - name: "GNOME | Record extension enable failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: enabling shell extensions failed — check vars/gnome.yml gnome_enabled_extensions'] }}"
  tags: gnome

# ── Dash-to-Dock configuration ────────────────────────────────────────────────
- block:
    - name: "GNOME | Configure Dash-to-Dock settings"
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop: "{{ gnome_dash_to_dock_settings }}"
  rescue:
    - name: "GNOME | Record Dash-to-Dock settings failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: Dash-to-Dock dconf settings failed — check vars/gnome.yml'] }}"
  tags: gnome
