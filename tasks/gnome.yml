---
# =============================================================================
# tasks/gnome.yml — GNOME Desktop Configuration
# =============================================================================
# All settings are driven by vars/gnome.yml.
# Requires: community.general collection (for dconf module).
# =============================================================================

# ── Dark theme RPM ────────────────────────────────────────────────────────────
- block:
    - name: "GNOME | Install adw-gtk3 dark theme"
      become: true
      ansible.builtin.dnf:
        name: adw-gtk3-theme
        state: present
  rescue:
    - name: "GNOME | Record adw-gtk3 install failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: adw-gtk3-theme install failed — dark theme may not apply'] }}"
  tags: gnome

# ── Dash-to-Dock extension ────────────────────────────────────────────────────
- block:
    - name: "GNOME | Install Dash-to-Dock GNOME shell extension"
      become: true
      ansible.builtin.dnf:
        name: gnome-shell-extension-dash-to-dock
        state: present
  rescue:
    - name: "GNOME | Record Dash-to-Dock install failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: Dash-to-Dock extension install failed'] }}"
  tags: gnome

# ── Extension Manager Flatpak ─────────────────────────────────────────────────
- block:
    - name: "GNOME | Install Extension Manager Flatpak"
      community.general.flatpak:
        name: com.mattjakeman.ExtensionManager
        state: present
        method: system
        remote: flathub
  rescue:
    - name: "GNOME | Record Extension Manager install failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: Extension Manager Flatpak install failed'] }}"
  tags: gnome

# ── Apply dconf settings ──────────────────────────────────────────────────────
- block:
    - name: "GNOME | Apply interface settings"
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop: "{{ gnome_interface_settings }}"
  rescue:
    - name: "GNOME | Record interface settings failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: interface dconf settings failed — check vars/gnome.yml'] }}"
  tags: gnome

- block:
    - name: "GNOME | Apply window manager settings"
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop: "{{ gnome_wm_settings }}"
  rescue:
    - name: "GNOME | Record window manager settings failure"
      ansible.builtin.set_fact:
        _run_errors: "{{ (_run_errors | default([])) + ['GNOME: window manager dconf settings failed — check vars/gnome.yml'] }}"
  tags: gnome

